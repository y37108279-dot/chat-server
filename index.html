<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Chat</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#2b2d31;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
margin-bottom:10px;
cursor:pointer;
}

.name{
font-weight:bold;
}

#status{
padding:5px 10px;
font-size:12px;
background:#1e1f22;
color:#aaa;
}

#sendArea{
display:flex;
padding:10px;
background:#1e1f22;
}

#msg{
flex:1;
padding:10px;
border:none;
border-radius:6px;
background:#383a40;
color:white;
}

button{
margin-left:6px;
padding:10px;
border:none;
border-radius:6px;
background:#5865F2;
color:white;
cursor:pointer;
}

button:hover{
background:#4752c4;
}

#login{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
display:flex;
justify-content:center;
align-items:center;
background:#2b2d31;
}

.panel{
background:#1e1f22;
padding:25px;
border-radius:10px;
width:300px;
}

.panel input{
width:100%;
margin-top:8px;
padding:10px;
border:none;
border-radius:6px;
background:#383a40;
color:white;
}
</style>
</head>

<body>

<div id="login">
<div class="panel">
<h2>名前入力</h2>
<input id="name" maxlength="15" placeholder="ユーザー名">
<button onclick="join()">参加</button>
</div>
</div>

<div id="status">未接続</div>

<div id="chat"></div>

<div id="sendArea">
<input id="msg" maxlength="400" placeholder="メッセージ">
<button onclick="send()">送信</button>
</div>

<script>

let ws;
let username;

function setStatus(text){
document.getElementById("status").innerText = text;
}

function connect(){

ws = new WebSocket("wss://YOUR-RENDER-URL.onrender.com");

ws.onopen = () => {
setStatus("接続済み");

// 入室通知
ws.send(JSON.stringify({
type: "join",
name: username
}));
};

ws.onmessage = async (e) => {

const data = JSON.parse(e.data);

// メッセージ
if(data.type === "message"){
addMsg(data.data);
}

// 既読更新
if(data.type === "read"){
const el = document.getElementById("read-" + data.data.messageId);
if(el){
el.innerText = "✔ " + data.data.readCount + "人";
}
}
};

ws.onclose = () => {
setStatus("切断 → 再接続中...");
setTimeout(connect, 2000);
};

ws.onerror = () => {
setStatus("エラー");
};

}

function join(){

const inputName = document.getElementById("name").value.trim();

if(!inputName){
alert("名前を入力してください");
return;
}

username = inputName;

document.getElementById("login").style.display = "none";

connect();
}

function addMsg(data){

const div = document.createElement("div");
div.className = "msg";

div.innerHTML =
"<span class='name'>" +
data.name +
"</span>: " +
data.message +
" <span id='read-" + data.id + "'>✔ 0人</span>";

div.onclick = () => {
ws.send(JSON.stringify({
type: "read",
messageId: data.id
}));
};

chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
}

function send(){

if(!ws || ws.readyState !== WebSocket.OPEN){
alert("未接続");
return;
}

const input = document.getElementById("msg");
const text = input.value;

if(!text) return;

ws.send(JSON.stringify({
type: "message",
name: username,
message: text
}));

input.value = "";
}

document.getElementById("msg").addEventListener("keydown", e=>{
if(e.key === "Enter") send();
});

</script>

</body>
</html>
